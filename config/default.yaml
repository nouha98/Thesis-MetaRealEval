project:
  output_dir: ./results
  seed: 42
  mock: false          # set to true for offline development (no LLM calls)

benchmark:
  name: humaneval
  tasks: null         # null = all 164; use [0, 1, 10] for a pilot subset

llm:
  # API key and base URL are read from INNKUBE_API_KEY / INNKUBE_BASE_URL env vars.
  # Only model IDs and generation parameters belong here.
  models:
    - id: gemma4-31b-it
    - id: qwen3-next-80b-a3b-instruct
    - id: qwen36-35b 
  max_concurrent_requests: 5    # asyncio semaphore: in-flight HTTP requests per process
  requests_per_minute: 20       # token-bucket rate: sustained throughput cap (tune upward if no 429s)
  retry_max_attempts: 5
  retry_base_delay_s: 2.0       # exponential backoff: 2s, 4s, 8s, 16s, 32s
  cache_dir: ./cache/llm_responses

execution:
  timeout_s: 10                 # per-test-case subprocess timeout
  cpu_workers: 4                # multiprocessing pool size; match SLURM --cpus-per-task

stage0:
  n_fuzz_inputs: 500            # random inputs per mutant for differential fuzzing

rq1:
  operators: [AOR, ROR, SDL]   # mutation operators for traditional mutants

rq2:
  n_completions: 10             # samples per (task, variant, model) triple
  temperature: 0.8

  # Deterministic template transforms (rq2/paraphraser.py), kept as a CONTROL ARM
  # so "templates understate instability by X" is a measured result. They barely
  # reword anything: `reorder` is a no-op on 88/164 prompts and `terse` on 103,
  # and a no-op prompt hashes to the same cache key as `original`, so those cells
  # return identical completions and score tau_b = 1.0 by construction.
  template_relations: [persona, formal, reorder, terse]

  # The unmodified prompt re-submitted under a cache salt, i.e. genuinely
  # re-sampled at temperature 0.8. Its tau_b is the sampling-noise floor that
  # every other relation is read against.
  include_control_resample: true

  # LLM paraphrase corpus: 5 families x 3 variants per task, generated once and
  # committed. Build it with scripts/generate_paraphrases.py, then paste the
  # sha256 it prints below. RQ2 generate verifies the hash and ABORTS on a
  # mismatch — it never silently regenerates, because two models seeing different
  # prompts is exactly the confound the committed corpus exists to prevent.
  # Leave paraphrase_corpus null to run the template arm alone.
  paraphrase_corpus: null       # ./data/paraphrases/humaneval_v1.json
  corpus_sha256: null

  # Corpus generator and equivalence judge. BOTH must be held out of llm.models:
  # judging paraphrases with the models being ranked filters on the dependent
  # variable and drives RQ2 toward a null by construction.
  # scripts/generate_paraphrases.py refuses to run if either is in llm.models.
  #
  # Same model for both roles is not the original intent (independence between
  # generator and judge is preferable) but is what this Innkube endpoint's
  # catalog allows: GET /v1/models lists only 7 ids total, and only two of the
  # non-embedding/reranker ones sit outside llm.models —
  # qwen-agentworld-35b-a3b and soofi-s-isar-preview. qwen-agentworld was tried
  # first and rejected: it reports its reasoning in a separate
  # `reasoning_content` field whose length scales with task difficulty and does
  # not reliably terminate — on HumanEval/32 it was still reasoning (40k+
  # characters, finish_reason="length") at a 12,000-token budget, with zero
  # tokens left for the actual rewrite. soofi-s-isar-preview reasons inline in
  # `content` behind a literal </think> tag (stripped generically by
  # InnkubeClient) and reliably reaches finish_reason="stop" within 8192 tokens
  # on every task tried, including HumanEval/32.
  generator_model: soofi-s-isar-preview
  judge_model: soofi-s-isar-preview

rq3:
  n_shared_inputs: 200          # shared random inputs for pairwise divergence
  # Divergence is O(n_solutions * n_shared_inputs) subprocess spawns, so RQ3 does
  # not inherit RQ2's full variant count: it samples this many LLM variants per
  # family (plus `original`), seeded from project.seed and the task label.
  # Raising it raises per-task execution cost linearly and invalidates the
  # calibrated divergence_threshold below.
  variant_sample_per_family: 1
  # Above this pairwise-disagreement rate a task gets RQ4 consistency assertions.
  # null = NOT yet calibrated: runs fall back to 0.1, log a warning, and tag their
  # output threshold_calibrated=false, and submit_pipeline.sh refuses to launch a
  # full run. Do not edit this by hand - run the Tier-1 pilot, then:
  #   .venv/bin/python scripts/analyze_results.py --calibrate
  # which derives the value (Youden's J on the per-task ROC) and writes it here.
  divergence_threshold: null

rq4:
  degradation_levels: [0.0, 0.2, 0.5, 0.8]
