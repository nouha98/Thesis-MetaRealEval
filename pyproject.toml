[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-real-eval"
version = "0.1.0"
description = "Bridging the evaluation trust gap in code LLM benchmarks"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml",
    "python-dotenv",
    "datasets>=3.0",
    "scipy",
    "numpy",
    "matplotlib",
    "pandas",
    "cosmic-ray>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
